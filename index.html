<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TENTH</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500&display=swap" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="gl"></canvas>

  <div id="loader" class="loader"><span id="pct">0%</span></div>

  <!-- chrome over the canvas: teaser + dots on home, the nav card on every section -->
  <div class="chrome">
    <div id="teaser" class="teaser"></div>

    <div id="card" class="card" hidden>
      <button id="menuToggle" class="icon menu" type="button" aria-label="Menu" aria-expanded="false">
        <span></span><span></span>
      </button>
      <a id="cardClose" class="icon close" href="/" aria-label="Close">&times;</a>
      <span id="cardLabel" class="card-label"></span>
      <a id="cardExpand" class="icon expand" href="/" aria-label="Expand">
        <span></span><span></span><span></span><span></span>
      </a>
      <nav id="menu" class="menu-list" hidden></nav>
    </div>

    <div class="credit">TENTH</div>

    <footer class="footer">
      <span id="label" class="label"></span>
      <nav id="dots" class="dots" aria-label="Sections"></nav>
    </footer>
  </div>

  <main id="page" class="page" hidden></main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
